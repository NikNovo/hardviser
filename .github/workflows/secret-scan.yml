name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools="$RUNNER_TEMP/hardviser-scanners"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz \
            --output "$tools/trufflehog.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tools/gitleaks.tar.gz" \
            7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08 "$tools/trufflehog.tar.gz" | sha256sum --check
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          tar -xzf "$tools/trufflehog.tar.gz" -C "$tools" trufflehog
      - name: Scan full history without disclosing findings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools="$RUNNER_TEMP/hardviser-scanners"
          reports="$(mktemp -d "$RUNNER_TEMP/secret-results.XXXXXX")"
          trap 'rm -rf -- "$reports"' EXIT
          gitleaks_status=0
          trufflehog_status=0
          "$tools/gitleaks" git "$GITHUB_WORKSPACE" --log-opts="--all" \
            --redact --no-banner --ignore-gitleaks-allow \
            --report-format json --report-path "$reports/gitleaks.json" \
            >"$reports/gitleaks.log" 2>&1 || gitleaks_status=$?
          "$tools/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --no-verification --no-update --no-ignore-tag \
            --results=verified,unknown,unverified,filtered_unverified \
            --fail --fail-on-scan-errors --json \
            >"$reports/trufflehog.jsonl" 2>"$reports/trufflehog.log" || trufflehog_status=$?
          printf 'Gitleaks exit: %s; TruffleHog exit: %s\n' "$gitleaks_status" "$trufflehog_status"
          if [ "$gitleaks_status" -ne 0 ] || [ "$trufflehog_status" -ne 0 ]; then
            echo 'Secret audit failed or was inconclusive. Inspect locally with private, redacted reports.'
            exit 1
          fi
