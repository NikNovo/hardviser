title = "Hardviser secret scan"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public localStorage preference key, not a credential; exact value and source/test paths only."
condition = "AND"
regexTarget = "secret"
regexes = ['''^hardviser\.appearance\.v1$''']
paths = ['''(^|/)src/appearance\.js$''', '''(^|/)test/appearance\.test\.js$''']

[[rules.allowlists]]
description = "Public localStorage navigation key, not a credential; exact value and source path only."
condition = "AND"
regexTarget = "secret"
regexes = ['''^hardissoft\.navigation\.v1$''']
paths = ['''(^|/)src/Shell\.jsx$''']

[[rules.allowlists]]
description = "Public pinned tokenizer artifact hashes, not API tokens; exact hashes in the model lock and encoder integrity checks only."
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39$''',
  '''^059214673d9d6d2ee319411e2ffec8c024b816d5$''',
  '''^e0b1d18ecd0ae4ff1d47bd297d910c0cf83e504b$''',
]
paths = [
  '''(^|/)backend/vendor/knowledge-base/model\.lock\.json$''',
  '''(^|/)backend/vendor/knowledge-base/src/hardissoft_kb/search/vector\.py$''',
]
