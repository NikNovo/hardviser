<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F8F6" />
  <script>
    // Pre-paint copy of resolveAppearance() in src/appearance.js; same storage key.
    try {
      var preference = localStorage.getItem('hardviser.appearance.v1');
      if (preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#181D21';
      }
    } catch (error) {}
  </script>
  <meta name="description" content="Engineering workspace for project context, files and decisions." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preload" href="/fonts/plex-sans-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>hardviser</title>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
